name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          python -m access_workflow generate --output data/check.csv --count 5
          python -m access_workflow demo
          python -m access_workflow audit --output output/audit.csv
